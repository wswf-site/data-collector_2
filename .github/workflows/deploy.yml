name: Deploy To Oracle

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Github Actions에 Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

#      여기부터 다름
      - name: GHCR에 로그인하기
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 생성
        run: docker build -t data-collector .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag data-collector ghcr.io/wswf-site/data-collector:latest

      - name: GHCR에 Docker 이미지 Push하기
        run: docker push ghcr.io/wswf-site/data-collector:latest

      - name: .env 파일 생성
        run: |
          echo "${{ secrets.DOCKER_COMPOSE_ENV_VARS }}" > ./.env

      - name: SCP로 Oracle에 Docker Compose 및 .env 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          source: compose.yml,.env
          target: /home/ubuntu/data-collector/

      - name: SSH로 EC2에 접속하여 Docker Compose 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/data-collector/
            docker compose down || true
            docker compose pull
            docker compose up -d
            docker image prune -f